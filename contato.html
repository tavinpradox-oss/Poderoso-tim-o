    <main>
        <section class="contato-area" aria-labelledby="titulo-contato">
            <div class="contato-conteudo">
                <div class="contato-informacoes">
                    <h1 id="titulo-contato">Entre em contato</h1>
                    <dl>
                        <div>
                            <dt>Endereço:</dt>
                            <dd>Neo Química Arena, São Paulo</dd>
                        </div>
                        <div>
                            <dt>Telefone:</dt>
                            <dd><a href="tel:+551112345678">(11) 1234-5678</a></dd>
                        </div>
                        <div>
                            <dt>Email:</dt>
                            <dd><a href="mailto:contato@poderosotimao.com.br">contato@poderosotimao.com.br</a></dd>
                        </div>
                    </dl>
                    <a class="botao-whatsapp" href="https://wa.me/551112345678" target="_blank" rel="noopener noreferrer">
                        <img src="whatsapp.png" alt=""> Fale no WhatsApp
                    </a>
                </div>

                <form class="formulario-contato" action="mailto:contato@poderosotimao.com.br" method="post" enctype="text/plain">
                    <label class="texto-acessivel" for="nome-contato">Nome completo</label>
                    <input id="nome-contato" name="Nome" type="text" placeholder="Nome Completo" autocomplete="name" required>

                    <label class="texto-acessivel" for="email-contato">E-mail</label>
                    <input id="email-contato" name="E-mail" type="email" placeholder="E-mail" autocomplete="email" required>

                    <label class="texto-acessivel" for="assunto-contato">Assunto</label>
                    <input id="assunto-contato" name="Assunto" type="text" placeholder="Assunto" required>

                    <label class="texto-acessivel" for="mensagem-contato">Mensagem</label>
                    <textarea id="mensagem-contato" name="Mensagem" placeholder="Mensagem" required></textarea>

                    <button type="submit">Enviar mensagem</button>
                </form>
            </div>
        </section>
        <section class="contato-final" aria-label="Contato">
            <h2>Fale com a gente!</h2>
        </section>
    </main>
